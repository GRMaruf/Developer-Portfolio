<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>New Contact Form Submission</title>
  <style>
    body { margin: 0; padding: 0; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; background-color: #0B1120; font-family: 'Inter', Arial, Helvetica, sans-serif; }
    table { border-collapse: collapse !important; mso-table-lspace: 0pt; mso-table-rspace: 0pt; width: 100%; }
    a { text-decoration: none; }
    @media only screen and (max-width: 600px) {
      .container { width: 100% !important; padding: 20px !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #0B1120;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color: #0B1120;">
    <tr>
      <td align="center" style="padding: 30px 15px;">
        <table role="presentation" class="container" width="600" cellspacing="0" cellpadding="0" border="0" style="background-color: #1E293B; border-radius: 16px; overflow: hidden; border: 1px solid #334155;">
          
          <!-- Header -->
          <tr>
            <td style="padding: 25px 40px; background-color: #111827; border-bottom: 1px solid #334155;">
              <h1 style="margin: 0; font-family: 'Poppins', Arial, sans-serif; color: #F8FAFC; font-size: 20px; font-weight: 600;">
                <span style="color: #38BDF8;">Note</span> {{ portfolio }}
              </h1>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 40px;">
              <p style="margin: 0 0 20px; color: #818CF8; font-family: 'JetBrains Mono', monospace; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;">New Portfolio Inquiry</p>
              <h2 style="margin: 0 0 30px; font-family: 'Poppins', Arial, sans-serif; color: #F8FAFC; font-size: 24px; font-weight: 600;">You have a new message</h2>
              
              <!-- Submission Details -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                <tr>
                  <td style="padding-bottom: 15px; width: 100px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #94A3B8;">Name:</td>
                  <td style="padding-bottom: 15px; color: #F8FAFC; font-size: 15px; font-weight: 500;">{{ sender_name }}</td>
                </tr>
                <tr>
                  <td style="padding-bottom: 15px; width: 100px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #94A3B8;">Email:</td>
                  <td style="padding-bottom: 15px; color: #F8FAFC; font-size: 15px; font-weight: 500;">{{ sender_email }}</td>
                </tr>
                <tr>
                  <td style="padding-bottom: 15px; width: 100px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #94A3B8;">Subject:</td>
                  <td style="padding-bottom: 15px; color: #F8FAFC; font-size: 15px; font-weight: 500;">{{ message_subject }}</td>
                </tr>
              </table>

              <div style="height: 1px; background-color: #334155; margin: 25px 0;"></div>

              <p style="margin: 0 0 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px;">Message</p>
              <div style="background-color: #0B1120; border-radius: 10px; padding: 20px; border: 1px solid #334155;">
                <p style="margin: 0; color: #F8FAFC; font-size: 15px; line-height: 1.6;">{{ message_body }}</p>
              </div>

              <!-- CTA -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="margin-top: 35px;">
                <tr>
                  <td align="center">
                    <a href="mailto:{{ sender_email }}" target="_blank" style="display: inline-block; padding: 14px 30px; background-color: #38BDF8; color: #0B1120; font-family: 'Poppins', Arial, sans-serif; font-size: 15px; font-weight: 600; border-radius: 999px; text-decoration: none;">
                      Reply to {{ sender_name }}
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 20px 40px; background-color: #0B1120; border-top: 1px solid #334155;">
              <p style="margin: 0; color: #94A3B8; font-size: 12px; text-align: center; font-family: 'JetBrains Mono', monospace;">
                Sent from your portfolio contact form
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
